# Al subir un tag v*, prueba, compila para amd64/arm64 y publica la release
# con los binarios, el instalador y sus checksums.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Pruebas
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...

      - name: Verificar sintaxis de los scripts
        run: |
          bash -n install-api-netbird.sh
          bash -n get-api-netbird.sh
          bash -n uninstall-legacy.sh

      - name: Compilar
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o dist/api-netbird-clients_linux_$arch .
          done
          cp install-api-netbird.sh get-api-netbird.sh uninstall-legacy.sh dist/
          cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done && ls -la

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
