name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Formato, vet y pruebas
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...

      - name: Scripts
        run: |
          bash -n install-api-netbird.sh
          bash -n get-api-netbird.sh
          bash -n uninstall-legacy.sh
          shellcheck -S warning install-api-netbird.sh get-api-netbird.sh uninstall-legacy.sh
